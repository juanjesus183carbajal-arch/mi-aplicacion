{% extends "base.html" %}{% block title %}Registro | EduPlay{% endblock %}
{% block content %}<section class="auth"><span class="eyebrow">EMPIEZA TU AVENTURA</span><h1>Crear cuenta ✨</h1><p>Guarda tu avance y tus puntos.</p><form method="post"><label>Nombre</label><input name="name" required placeholder="Tu nombre"><label>Usuario</label><input name="username" required placeholder="Crea un usuario"><label>Contraseña</label><input type="password" name="password" minlength="6" required placeholder="Mínimo 6 caracteres"><button class="btn primary">Registrarme</button></form><p class="small">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p></section>{% endblock %}
